name: Portfolio Analysis

on:
  schedule:
    - cron: '0 13 * * 1-5'  # 20:00 Bangkok — US pre-market, ดูพอร์ตก่อนตลาดเปิด
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python portfolio.py

      - name: Commit data snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): portfolio snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
